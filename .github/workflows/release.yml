name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
      - name: Build app
        run: ./build.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent MainMic.app MainMic.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/MainMic.zip \
            --title "MainMic $GITHUB_REF_NAME" \
            --notes "Download **MainMic.zip**, unzip, and drag MainMic.app into Applications. See the README for install steps."
