name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./build.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent MainMic.app MainMic.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MainMic
          path: build/MainMic.zip
